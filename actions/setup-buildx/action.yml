name: Setup Buildx
description: Set up Docker Buildx with configurable buildkitd-config-inline

inputs:
  buildkitd-config-inline:
    description: Inline BuildKit daemon configuration
    required: false
    default: |
      [registry."docker.io"]
        mirrors = ["mirror.gcr.io"]

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        buildkitd-config-inline: ${{ inputs.buildkitd-config-inline }}
