name: Setup Go
description: Set up Go using actions/setup-go and download Go modules

inputs:
  go-version-file:
    description: Path to go.mod relative to repository root
    required: false
    default: go.mod
  cache-dependency-path:
    description: Path to go.sum relative to repository root
    required: false
    default: go.sum
  cache:
    description: Whether to cache Go modules and build cache
    required: false
    default: "true"
  working-directory:
    description: Working directory containing go.mod
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        cache: ${{ inputs.cache }}
        check-latest: true # use the latest patch release matching go.mod
    - name: Download Go modules
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go mod download
