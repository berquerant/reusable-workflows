name: rust-ci

permissions: {}

on:
  workflow_call:
    inputs:
      working-directory:
        description: Working directory containing Cargo.toml
        type: string
        default: "."
      toolchain:
        description: Rust toolchain to install via rustup
        type: string
        default: stable
      components:
        description: Space-separated rustup components to install
        type: string
        default: "clippy rustfmt"
      submodules:
        description: Whether to checkout git submodules
        type: boolean
        default: false
      lint-command:
        description: Shell command for linting (skipped when empty)
        type: string
        default: ""
      test-command:
        description: Shell command for testing (skipped when empty)
        type: string
        default: make test
      build-command:
        description: Shell command for building (skipped when empty)
        type: string
        default: ""
      run-audit:
        description: Whether to run cargo audit
        type: boolean
        default: true
      timeout-minutes:
        description: Job timeout in minutes
        type: number
        default: 20

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # only builds matrix JSON from inputs; no token permissions needed
    outputs:
      tasks: ${{ steps.build-matrix.outputs.tasks }}
      has-tasks: ${{ steps.build-matrix.outputs.has-tasks }}
    steps:
      - name: Build task matrix
        id: build-matrix
        env:
          LINT_COMMAND: ${{ inputs.lint-command }}
          TEST_COMMAND: ${{ inputs.test-command }}
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          tasks="$(jq -n -c \
            --arg lint "$LINT_COMMAND" \
            --arg test "$TEST_COMMAND" \
            --arg build "$BUILD_COMMAND" \
            '[
              (if $lint != "" then {name: "Lint", command: $lint} else empty end),
              (if $test != "" then {name: "Test", command: $test} else empty end),
              (if $build != "" then {name: "Build", command: $build} else empty end)
            ]')"
          echo "tasks=${tasks}" >> "$GITHUB_OUTPUT"
          if [ "$tasks" = "[]" ]; then
            echo "has-tasks=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-tasks=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: ${{ matrix.task.name }}
    needs: prepare
    if: needs.prepare.outputs.has-tasks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # checkout repository for running Rust checks
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJson(needs.prepare.outputs.tasks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: ${{ inputs.submodules }} # enable when workspace or tests depend on git submodules
          persist-credentials: false
      - name: Set up Rust
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
          COMPONENTS: ${{ inputs.components }}
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup install "$TOOLCHAIN"
          rustup default "$TOOLCHAIN"
          if [ -n "$COMPONENTS" ]; then
            # shellcheck disable=SC2086
            rustup component add $COMPONENTS
          fi
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: ${{ inputs.working-directory }}
      - name: Run ${{ matrix.task.name }}
        working-directory: ${{ inputs.working-directory }}
        env:
          COMMAND: ${{ matrix.task.command }}
        run: bash -euo pipefail -c "$COMMAND"

  audit:
    name: Audit
    if: inputs.run-audit
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # checkout repository for cargo-audit advisory scanning
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: ${{ inputs.submodules }} # enable when workspace depends on git submodules
          persist-credentials: false
      - name: Set up Rust
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup install "$TOOLCHAIN"
          rustup default "$TOOLCHAIN"
      - name: Cache cargo-audit
        id: cache-audit
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-v1
      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-audit
      - name: Run cargo audit
        working-directory: ${{ inputs.working-directory }}
        run: cargo audit

  summary:
    name: Rust CI
    needs:
      - prepare
      - check
      - audit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # only evaluates upstream job results; no token permissions needed
    steps:
      - name: Check results
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          if [ "$PREPARE_RESULT" != "success" ]; then
            echo "Rust CI failed in prepare ($PREPARE_RESULT)" >&2
            exit 1
          fi
          for result in "$CHECK_RESULT" "$AUDIT_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Rust CI failed (check=$CHECK_RESULT, audit=$AUDIT_RESULT)" >&2
              exit 1
            fi
          done
