name: python-uv-ci

permissions: {}

on:
  workflow_call:
    inputs:
      working-directory:
        description: Working directory containing pyproject.toml
        type: string
        default: "."
      python-version:
        description: Python version to install via uv (uses .python-version when empty)
        type: string
        default: ""
      sync-command:
        description: Shell command to sync Python dependencies
        type: string
        default: uv sync --locked --all-extras --dev
      command:
        description: Shell command to run CI checks
        type: string
        default: make ci
      submodules:
        description: Whether to checkout git submodules
        type: boolean
        default: false
      timeout-minutes:
        description: Job timeout in minutes
        type: number
        default: 20

jobs:
  ci:
    name: Python UV CI
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # checkout repository for Python uv CI
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: ${{ inputs.submodules }} # enable when project or tests depend on git submodules
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Set up Python
        working-directory: ${{ inputs.working-directory }}
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          if [ -n "$PYTHON_VERSION" ]; then
            uv python install "$PYTHON_VERSION"
          else
            uv python install
          fi
      - name: Sync dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          SYNC_COMMAND: ${{ inputs.sync-command }}
        run: bash -euo pipefail -c "$SYNC_COMMAND"
      - name: Run checks
        working-directory: ${{ inputs.working-directory }}
        env:
          COMMAND: ${{ inputs.command }}
        run: bash -euo pipefail -c "$COMMAND"
