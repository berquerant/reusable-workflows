name: go-ci

permissions: {}

on:
  workflow_call:
    inputs:
      working-directory:
        description: Working directory containing the Go module
        type: string
        default: "."
      go-version-file:
        description: Path to go.mod relative to repository root
        type: string
        default: go.mod
      cache-dependency-path:
        description: Path to go.sum relative to repository root
        type: string
        default: go.sum
      submodules:
        description: Whether to checkout git submodules
        type: boolean
        default: false
      lint-command:
        description: Shell command for linting (skipped when empty)
        type: string
        default: ""
      test-command:
        description: Shell command for testing (skipped when empty)
        type: string
        default: make test
      build-command:
        description: Shell command for building (skipped when empty)
        type: string
        default: ""
      run-govulncheck:
        description: Whether to run berquerant/govulncheck-action
        type: boolean
        default: true
      timeout-minutes:
        description: Job timeout in minutes
        type: number
        default: 10

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # only builds matrix JSON from inputs; no token permissions needed
    outputs:
      tasks: ${{ steps.build-matrix.outputs.tasks }}
      has-tasks: ${{ steps.build-matrix.outputs.has-tasks }}
    steps:
      - name: Build task matrix
        id: build-matrix
        env:
          LINT_COMMAND: ${{ inputs.lint-command }}
          TEST_COMMAND: ${{ inputs.test-command }}
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          tasks="$(jq -n -c \
            --arg lint "$LINT_COMMAND" \
            --arg test "$TEST_COMMAND" \
            --arg build "$BUILD_COMMAND" \
            '[
              (if $lint != "" then {name: "Lint", command: $lint} else empty end),
              (if $test != "" then {name: "Test", command: $test} else empty end),
              (if $build != "" then {name: "Build", command: $build} else empty end)
            ]')"
          echo "tasks=${tasks}" >> "$GITHUB_OUTPUT"
          if [ "$tasks" = "[]" ]; then
            echo "has-tasks=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-tasks=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: ${{ matrix.task.name }}
    needs: prepare
    if: needs.prepare.outputs.has-tasks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # checkout repository for running Go checks
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJson(needs.prepare.outputs.tasks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: ${{ inputs.submodules }} # enable when tests or codegen depend on git submodules
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          check-latest: true # use the latest patch release matching go.mod
      - name: Download Go modules
        working-directory: ${{ inputs.working-directory }}
        run: go mod download
      - name: Run ${{ matrix.task.name }}
        working-directory: ${{ inputs.working-directory }}
        env:
          COMMAND: ${{ matrix.task.command }}
        run: bash -euo pipefail -c "$COMMAND"

  govulncheck:
    name: Govulncheck
    if: inputs.run-govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # checkout repository for vulnerability scanning
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: ${{ inputs.submodules }} # enable when module layout depends on git submodules
          persist-credentials: false
      - name: Run govulncheck
        uses: berquerant/govulncheck-action@v1.0.4
        with:
          checkout: false # already checked out above with persist-credentials and submodules settings
          go-version-file: ${{ inputs.go-version-file }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          chdir: ${{ inputs.working-directory }}

  summary:
    name: Go CI
    needs:
      - prepare
      - check
      - govulncheck
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # only evaluates upstream job results; no token permissions needed
    steps:
      - name: Check results
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          GOVULNCHECK_RESULT: ${{ needs.govulncheck.result }}
        run: |
          if [ "$PREPARE_RESULT" != "success" ]; then
            echo "Go CI failed in prepare ($PREPARE_RESULT)" >&2
            exit 1
          fi
          for result in "$CHECK_RESULT" "$GOVULNCHECK_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Go CI failed (check=$CHECK_RESULT, govulncheck=$GOVULNCHECK_RESULT)" >&2
              exit 1
            fi
          done
