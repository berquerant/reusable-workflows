name: helm-chart-ci

permissions: {}

on:
  workflow_call:
    inputs:
      chart-dir:
        description: Path to the Helm chart directory (e.g. charts/my-chart)
        type: string
        required: true
      helm-version:
        description: Helm version to install via azure/setup-helm
        type: string
        default: latest
      timeout-minutes:
        description: Job timeout in minutes
        type: number
        default: 10

jobs:
  ci:
    name: Run
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # checkout repository and lint/install chart
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0
      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0
        with:
          version: ${{ inputs.helm-version }}
      - name: Run helm lint
        env:
          CHART_DIR: ${{ inputs.chart-dir }}
        run: helm lint --strict "$CHART_DIR"
      - name: Run chart-testing (lint)
        env:
          CHART_DIR: ${{ inputs.chart-dir }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct lint --charts "$CHART_DIR" --target-branch "$TARGET_BRANCH"
      - name: Create kind cluster
        uses: helm/kind-action@v1.15.2
      - name: Run chart-testing (install)
        env:
          CHART_DIR: ${{ inputs.chart-dir }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct install --charts "$CHART_DIR" --target-branch "$TARGET_BRANCH"
