name: helm-chart-snapshot

permissions: {}

on:
  workflow_call:
    inputs:
      chart-name:
        description: Chart name under tests/ (e.g. fluent-sandbox)
        type: string
        required: true
      generate-script:
        description: Path to the manifest generation script
        type: string
        default: ./tests/generate.sh
      timeout-minutes:
        description: Job timeout in minutes
        type: number
        default: 5

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      values: ${{ steps.set-matrix.outputs.values }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Generate matrix values
        id: set-matrix
        env:
          CHART_NAME: ${{ inputs.chart-name }}
          GENERATE_SCRIPT: ${{ inputs.generate-script }}
        run: |
          values="$("$GENERATE_SCRIPT" ls "$CHART_NAME" | sed "s|^${PWD}/tests/${CHART_NAME}/values/||" | jq -R -s -c 'split("\n")|map(select(length > 0))')"
          echo "values=${values}" >> "$GITHUB_OUTPUT"

  generate-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Generate manifests
        env:
          CHART_NAME: ${{ inputs.chart-name }}
          GENERATE_SCRIPT: ${{ inputs.generate-script }}
        run: |
          "$GENERATE_SCRIPT" gen "$CHART_NAME" generated
          mv "tests/${CHART_NAME}/generated" .
      - name: Upload manifests
        uses: actions/upload-artifact@v7.0.2
        with:
          name: generated-manifests
          path: generated
          retention-days: 1

  test:
    needs:
      - generate-matrix
      - generate-manifests
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        value: ${{ fromJson(needs.generate-matrix.outputs.values) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: generated-manifests
          path: generated
      - name: Move golden
        env:
          CHART_NAME: ${{ inputs.chart-name }}
        run: mv "tests/${CHART_NAME}/golden" .
      - name: Compare manifests
        id: objdiff
        uses: berquerant/k8s-object-diff@v0.6.0
        with:
          left: golden/${{ matrix.value }}
          right: generated/${{ matrix.value }}
          fail-on-diff: true

  summary:
    name: Snapshot
    needs:
      - generate-matrix
      - generate-manifests
      - test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        env:
          GENERATE_MATRIX_RESULT: ${{ needs.generate-matrix.result }}
          GENERATE_MANIFESTS_RESULT: ${{ needs.generate-manifests.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$GENERATE_MATRIX_RESULT" != "success" ] || [ "$GENERATE_MANIFESTS_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ]; then
            echo "Snapshot failed (generate-matrix=$GENERATE_MATRIX_RESULT, generate-manifests=$GENERATE_MANIFESTS_RESULT, test=$TEST_RESULT)" >&2
            exit 1
          fi
